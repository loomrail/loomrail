<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Loomrail — AI agents work. You decide.</title>
  <desc id="desc">Dark product-led preview showing Loomrail's brief, agent work, evidence, and owner-decision route.</desc>

  <rect width="1280" height="640" fill="#111217" />
  <rect x="64" y="54" width="44" height="44" rx="11" fill="#6173ff" />
  <path d="M77 67v18h18M85 67v10h10" fill="none" stroke="#f7f8fc" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" />
  <text x="126" y="87" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-1.2">Loomrail</text>

  <text x="64" y="196" fill="#8990a2" font-family="JetBrains Mono, monospace" font-size="18">PUBLIC PRE-ALPHA · 0.1.0-ALPHA.2</text>
  <text x="64" y="286" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="67" font-weight="680" letter-spacing="-3.2">AI agents work.</text>
  <text x="64" y="358" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="67" font-weight="680" letter-spacing="-3.2">You decide.</text>
  <text x="64" y="420" fill="#aeb3c0" font-family="Geist, Inter, Arial, sans-serif" font-size="23">Durable state, observable gates,</text>
  <text x="64" y="452" fill="#aeb3c0" font-family="Geist, Inter, Arial, sans-serif" font-size="23">evidence, budgets, and owner acceptance.</text>
  <rect x="64" y="510" width="374" height="58" rx="29" fill="#f7f8fc" />
  <text x="95" y="547" fill="#111217" font-family="JetBrains Mono, monospace" font-size="18" font-weight="650">npm install loomrail@next</text>

  <path d="M786 156v332" stroke="#343847" stroke-width="2" />
  <circle cx="786" cy="164" r="7" fill="#6173ff" />
  <text x="820" y="171" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="27" font-weight="650">Brief</text>
  <text x="820" y="199" fill="#8990a2" font-family="Geist, Inter, Arial, sans-serif" font-size="17">Observable acceptance</text>

  <circle cx="786" cy="265" r="7" fill="#6173ff" />
  <text x="820" y="272" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="27" font-weight="650">Agent work</text>
  <text x="820" y="300" fill="#8990a2" font-family="Geist, Inter, Arial, sans-serif" font-size="17">Bounded provider sessions</text>

  <circle cx="786" cy="366" r="7" fill="#6173ff" />
  <text x="820" y="373" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="27" font-weight="650">Evidence</text>
  <text x="820" y="401" fill="#8990a2" font-family="Geist, Inter, Arial, sans-serif" font-size="17">Review and QA stay attached</text>

  <circle cx="786" cy="467" r="9" fill="#6173ff" />
  <rect x="810" y="430" width="370" height="78" rx="16" fill="none" stroke="#6173ff" stroke-width="2" />
  <text x="840" y="465" fill="#f7f8fc" font-family="Geist, Inter, Arial, sans-serif" font-size="27" font-weight="650">Owner decision</text>
  <text x="840" y="492" fill="#aeb3c0" font-family="Geist, Inter, Arial, sans-serif" font-size="17">Accept or return to work</text>
</svg>
