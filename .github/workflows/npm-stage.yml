name: Stage stable npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semver already set in apps/cli/package.json (for example, 0.1.0)
        required: true
        type: string
      source_commit:
        description: Exact 40-character main commit with a successful CI run
        required: true
        type: string
      confirmation:
        description: Type STAGE loomrail@<version> FROM <source_commit>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stable-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Stage loomrail@${{ inputs.version }}
    if: github.repository == 'loomrail/loomrail' && github.ref == 'refs/heads/main'
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out the approved source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the pinned Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify exact owner intent and blocking CI
        run: node scripts/verify-release-stage.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOOMRAIL_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          LOOMRAIL_RELEASE_VERSION: ${{ inputs.version }}
          LOOMRAIL_SOURCE_COMMIT: ${{ inputs.source_commit }}

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify source
        run: pnpm verify
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install Chromium for release verification
        run: pnpm exec playwright install chromium

      - name: Verify crash and fault recovery
        run: pnpm test:fault-injection

      - name: Verify browser behavior
        run: pnpm test:e2e

      - name: Build the exact release tarball
        run: pnpm pack:release

      - name: Verify the exact release tarball
        run: pnpm test:release

      - name: Preserve the candidate and receipt for owner review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loomrail-${{ inputs.version }}-candidate
          path: |
            dist-release/loomrail-${{ inputs.version }}.tgz
            dist-release/loomrail-${{ inputs.version }}.receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage the verified package for separate owner approval
        run: >-
          npm stage publish
          "./dist-release/loomrail-${LOOMRAIL_RELEASE_VERSION}.tgz"
          --tag latest
          --access public
          --provenance
        env:
          LOOMRAIL_RELEASE_VERSION: ${{ inputs.version }}
