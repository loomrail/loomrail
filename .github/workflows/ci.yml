name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Corepack installs the pnpm version pinned by `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep the Windows process-tree release gate visible even if a later repository-wide check fails.
      # The trailing `...` selects the gateway *and its workspace dependencies*: their `dist` is
      # gitignored, so without building them first `tsc` cannot resolve `@loomrail/contracts`.
      - name: Verify Windows MCP process-tree lifecycle
        if: runner.os == 'Windows'
        run: |
          pnpm --filter "@loomrail/mcp-gateway..." build
          pnpm --filter @loomrail/mcp-gateway test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Exercise the fixed-argv child-process boundary on both supported platforms before a
      # protected source lint failure can hide the compatibility evidence.
      - name: Verify provider compatibility probes
        run: pnpm exec vitest run apps/daemon/test/provider-compatibility.unit.test.ts

      # The named fault matrix includes the real Playwright BrowserDriver suite. A fresh runner has
      # the package but no browser binary; keep that prerequisite explicit instead of weakening the
      # suite into a skip or treating a missing executable as crash-recovery evidence.
      - name: Install Chromium for fault injection
        run: pnpm exec playwright install chromium

      # Runs before repository-wide lint so an unrelated source failure cannot hide crash evidence.
      - name: Verify crash and fault recovery
        run: pnpm test:fault-injection

      - name: Verify source and SQLite portability
        run: pnpm verify
        env:
          # ESLint's typed-program graph crosses the whole workspace and exceeded Node's default
          # 2 GiB heap on the arm64 macOS runner before it could report the actual lint gate.
          NODE_OPTIONS: --max-old-space-size=4096

  browser:
    name: Browser smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Browser QA and the Workbench
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run browser smoke test
        run: pnpm test:e2e

  release:
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Corepack installs the pnpm version pinned by `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the release tarball
        run: pnpm pack:release

      # Keep Q7's file-mode/lease/retention unit contract visible even when protected landing lint
      # prevents the repository-wide Verify job from reaching workspace tests.
      - name: Verify local log lifecycle
        run: pnpm --filter @loomrail/cli test

      # Guided setup must prove the Browser QA prerequisite from the same clean-machine lane. The
      # package install remains lifecycle-script-free; this explicit owner-equivalent step is what
      # downloads Chromium.
      - name: Install Chromium for guided setup
        run: pnpm exec playwright install chromium

      # Proves the published layout works from a registry install, which `pnpm verify` cannot show.
      - name: Verify the tarball on a clean install
        run: pnpm test:release
