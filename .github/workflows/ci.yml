name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # Corepack installs the pnpm version pinned by `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and SQLite portability
        run: pnpm verify

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run browser smoke test
        run: pnpm test:e2e

  release:
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # Corepack installs the pnpm version pinned by `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the release tarball
        run: pnpm pack:release

      # Proves the published layout works from a registry install, which `pnpm verify` cannot show.
      - name: Verify the tarball on a clean install
        run: pnpm test:release
