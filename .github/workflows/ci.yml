name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Enable pnpm 11.21.0
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and SQLite portability
        run: pnpm verify

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run browser smoke test
        run: pnpm test:e2e

  release:
    name: Clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Enable pnpm 11.21.0
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the release tarball
        run: pnpm pack:release

      # Proves the published layout works from a registry install, which `pnpm verify` cannot show.
      - name: Verify the tarball on a clean install
        run: pnpm test:release
