name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "apps/landing/**"
      - "apps/cli/package.json"
      - "docs/assets/brand/**"
      - "docs/assets/demo/**"
      - "docs/assets/screenshots/**"
      - "package.json"
      - "packages/contracts/src/activation.ts"
      - "packages/contracts/src/guided-activation.v1.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/verify-activation-contract.mjs"
      - "scripts/verify-activation-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static landing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the pinned Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the protected browser gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Test and build the landing
        run: |
          pnpm test:activation
          pnpm --filter @loomrail/landing typecheck
          pnpm --filter @loomrail/landing test
          pnpm --filter @loomrail/landing build

      - name: Run the protected landing browser gate
        run: pnpm exec playwright test --config apps/landing/playwright.config.ts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/landing/dist

  deploy:
    name: Deploy landing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
